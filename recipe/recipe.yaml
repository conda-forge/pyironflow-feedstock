schema_version: 1

context:
  name: pyironflow
  version: 0.1.4
  python_min: '3.11'

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/pyironflow-${{ version }}.tar.gz
  sha256: c527b270dda0794563161b4b05b594ee3ce4684711f39310f5e87caed8fac0ec

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - hatch-vcs
    - pip
  run:
    - python >=${{ python_min }},<3.15
    - anywidget ==0.9.18
    - bagofholding >=0.1.14,<0.2.0
    - flowrep >=0.6.7,<0.7.0
    - ipykernel>=7.3.0,<7.5.0
    - ipytree ==0.2.2
    - ipython >=9.16.1,<9.17.0
    - ipywidgets >=8.1.8,<8.2.0
    - pyiron_workflow >=0.20.3,<0.21.0
    - traitlets >=5.14.3,<5.15.0
tests:
  - python:
      imports:
        - pyironflow
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: react xyflow for pyiron
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/pyiron/pyironFlow

extra:
  recipe-maintainers:
    - pmrv
    - jan-janssen
    - srmnitc
    - liamhuber
