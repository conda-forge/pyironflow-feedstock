schema_version: 1

context:
  name: pyironflow
  version: 0.1.3
  python_min: '3.11'

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/pyironflow-${{ version }}.tar.gz
  sha256: 9cf56518f7cc794898af782d99601ddad5454320a039ee1afb17e2b2befbe1d6

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - hatch-vcs
    - versioneer
    - pip
    - anywidget
    - ipytree
    - ipython
    - ipywidgets
    - traitlets
    - pyiron_workflow
  run:
    - python >=${{ python_min }},<3.15
    - anywidget ==0.9.18
    - bagofholding >=0.1.12,<0.2.0
    - ipytree ==0.2.2
    - ipython >=9.16.1,<9.17.0
    - ipywidgets >=8.1.8,<8.2.0
    - pyiron_workflow >=0.20.0,<0.21.0
    - traitlets >=5.14.3,<5.15.0
tests:
  - python:
      imports:
        - pyironflow
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: react xyflow for pyiron
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/pyiron/pyironFlow

extra:
  recipe-maintainers:
    - pmrv
    - jan-janssen
    - srmnitc
    - liamhuber
