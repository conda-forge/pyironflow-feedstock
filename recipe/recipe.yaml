schema_version: 1

context:
  name: pyironflow
  version: 0.0.22
  python_min: '3.11'

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/pyironflow-${{ version }}.tar.gz
  sha256: 4fc3228d40c9be130a8036ced74c4160d2b1581b5e4dbc280e8d328d243ea7a2

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - hatch-vcs
    - hatch-jupyter-builder
    - versioneer
    - pip
    - anywidget
    - esbuild
    - ipytree
    - ipython
    - ipywidgets
    - nodejs
    - traitlets
    - pyiron_workflow
  run:
    - python >=${{ python_min }},<3.13
    - anywidget ==0.9.18
    - traitlets >=5.14.3,<5.15.0
    - ipytree ==0.2.2
    - ipython >=8.37.0,<8.38.0
    - ipywidgets >=8.1.8,<8.2.0
    - pyiron_workflow ==0.15.4
tests:
  - python:
      imports:
        - pyironflow
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: react xyflow for pyiron
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/pyiron/pyironFlow

extra:
  recipe-maintainers:
    - pmrv
    - jan-janssen
    - srmnitc
